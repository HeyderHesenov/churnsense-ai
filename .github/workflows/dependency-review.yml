name: Dependency review

# Fails a pull request that adds or upgrades to a dependency with a known
# vulnerability. It compares the dependency graph of the two commits through
# the API, so it needs no checkout and runs no code from the pull request.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04  # pinned, as in ci.yml
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
