name: Dependency review

# Fails a pull request that adds or upgrades to a dependency with a known
# vulnerability. It compares the dependency graph of the two commits through
# the API, so it needs no checkout and runs no code from the pull request.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
