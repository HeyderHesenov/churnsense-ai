name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (a tag can be moved; a SHA cannot),
# with the release they belong to in a comment. Dependabot keeps both current.
# The runner image is pinned too: ubuntu-latest moves to 26.04 gradually from
# 2026-10-19, so two runs could land on different images. Dependabot does not
# update runner labels; moving to 26.04 is a deliberate change.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    # The suite takes about an hour since every training table is guarded as one
    # system (churnsense.joint_disclosure) on the synthetic books; making it faster
    # is a task of its own. Until then the job may take two hours, not half of one.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      # No later step pushes, so the token is not left in .git/config for
      # every dependency's install hooks to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src app tests scripts
          ruff format --check src app tests scripts

      # No dataset download and no network: the suite runs entirely on the
      # seeded synthetic fixture in tests/conftest.py, which reproduces the
      # real file's structure (including its blank-TotalCharges quirk) without
      # any of its data.
      - name: Test
        # No -q here: pyproject's addopts already has one, and -qq hides the summary.
        # -rs prints every skipped test with its reason, so a skip is read, not counted.
        run: pytest -rs --cov=churnsense --cov-report=term-missing

      - name: Smoke-test the training pipeline end to end
        run: |
          python - <<'PY'
          """Train, persist, reload and score - on fixture data only.

          Guards the path `make train` takes, without CI needing the real
          dataset. No performance number is asserted: the fixture's statistics
          are invented, so a threshold on them would be theatre.
          """
          import tempfile
          from pathlib import Path
          import sys

          sys.path.insert(0, "tests")
          from conftest import make_synthetic_raw

          from churnsense.data.loader import clean_frame, features_and_target
          from churnsense.data.split import make_splits
          from churnsense.models.predict import load_predictor
          from churnsense.models.train import save_artifact, train_all

          frame, _ = clean_frame(make_synthetic_raw(n=600, seed=1))
          X, y = features_and_target(frame)
          splits = make_splits(X, y)
          outcome = train_all(splits.X_train, splits.y_train, splits.X_val, splits.y_val)

          with tempfile.TemporaryDirectory() as directory:
              save_artifact(outcome, Path(directory))
              predictor = load_predictor(Path(directory))
              scored = predictor.predict_frame(splits.X_test)

          assert len(scored) == len(splits.X_test)
          assert scored["churn_probability"].between(0, 1).all()
          assert outcome.selected_key != "dummy", "the baseline must not win"
          print(f"OK  selected={outcome.selected_key}  scored={len(scored)} rows")
          PY

      - name: Smoke-test the API
        run: |
          python - <<'PY'
          """Import the app and hit /health. Verifies the service starts with
          no artifact present and reports that honestly rather than crashing."""
          from fastapi.testclient import TestClient
          from churnsense.api import main

          # The API answers loopback peers only; TestClient's default peer is
          # the placeholder "testclient", so give it this machine's address.
          with TestClient(
              main.app, base_url="http://localhost", client=("127.0.0.1", 50000)
          ) as client:
              body = client.get("/health").json()
              assert body["status"] in {"ok", "degraded"}, body
              print(f"OK  /health -> {body}")
          PY

  # The job above tests the newest versions pyproject's ranges allow; this one
  # tests the exact pins users get, through the same `make setup` they run,
  # with every file checked against the sha256 in the lock. It is what
  # validates a Dependabot bump to the locks, files no other job installs.
  # It then installs the runtime lock on its own, proves the service and the
  # dashboard run on it, and keeps that environment's SBOM.
  lock:
    name: test (lock, py3.12)
    runs-on: ubuntu-24.04
    # The full suite runs here too: see the test job's limit.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the dev lock with make setup
        run: make setup PYTHON=python

      # The locks are resolved for Linux and macOS together, and a Dependabot
      # pull request may touch one file only; pip check catches pins that no
      # longer agree with each other.
      - name: Check the lock is consistent
        run: .venv/bin/python -m pip check

      - name: Test
        # Every skipped test with its reason, as in the job above.
        env:
          PYTEST_ADDOPTS: -rs
        run: make test

      - name: Install the runtime lock alone and write its SBOM
        run: make sbom PYTHON=python

      # Nothing from the dev lock is on the path here: a runtime module that
      # imports a dev-only package fails this step, not a deployment.
      - name: Smoke-test the runtime lock alone
        env:
          PYTHONPATH: src:.
        run: |
          .venv-runtime/bin/python - <<'PY'
          """Import every module, then run the dashboard script once."""
          import importlib
          import pkgutil

          import app
          import churnsense
          from streamlit.testing.v1 import AppTest

          names = [
              m.name
              for package in (churnsense, app)
              for m in pkgutil.walk_packages(package.__path__, package.__name__ + ".")
          ]
          # streamlit_app is a script, not a library module: AppTest runs it.
          names.remove("app.streamlit_app")
          for name in names:
              importlib.import_module(name)
          print(f"OK  imported {len(names)} modules")

          at = AppTest.from_file("app/streamlit_app.py", default_timeout=120).run()
          assert not at.exception, [e.value for e in at.exception]
          print("OK  dashboard script ran without an exception")
          PY

          # A real server rather than TestClient, which needs httpx (dev only).
          .venv-runtime/bin/uvicorn churnsense.api.main:app --host 127.0.0.1 --port 8765 &
          server=$!
          for _ in $(seq 30); do
            kill -0 "$server"  # it exited: port taken or import failed
            body=$(curl -fsS http://127.0.0.1:8765/health) && break
            sleep 1
          done
          kill "$server"
          # model_loaded is this API's own field, so another server that
          # happens to answer on the port cannot pass for it.
          echo "$body" | .venv-runtime/bin/python -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["status"] in {"ok", "degraded"} and "model_loaded" in body, body
          '
          echo "OK  /health -> $body"

      - name: Keep the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  security:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Blocking. This job is a required check, so a known vulnerability fails
      # the pull request instead of scrolling past in a log. pip-audit reports
      # no severities, so every advisory blocks; one that is assessed and
      # accepted is listed with --ignore-vuln on both steps, with its reason
      # and review date in SECURITY.md ("Dependency audits"). None is today.
      # --skip-editable: the project installs itself editable and is not on
      # PyPI, which pip-audit would otherwise report as un-auditable.
      - name: pip-audit
        run: pip-audit --skip-editable

      # The install above resolves pyproject's ranges as of today; users get
      # the exact pins in the locks from `make setup`. Audit those too, so a
      # vulnerable pinned version cannot hide behind a newer resolution.
      # --disable-pip reads the pins as written instead of installing them,
      # and --require-hashes fails on any entry that lost its hash.
      - name: pip-audit (locks)
        run: pip-audit -r requirements.txt -r requirements-dev.txt --require-hashes --disable-pip

      # A file-presence check, not a secret scan: GitHub secret scanning with
      # push protection covers credentials (see SECURITY.md). This keeps the
      # gitignored local files - .env, the raw dataset, model artifacts - out.
      - name: Check that no .env, raw data or model artifact is tracked
        run: |
          set -e
          test ! -f .env || (echo "::error::.env is committed" && exit 1)
          if git ls-files | grep -E '^data/raw/.*\.csv$'; then
            echo "::error::raw data is committed; it should be fetched by 'make data'"
            exit 1
          fi
          if git ls-files | grep -E '^artifacts/.*\.(joblib|pkl)$'; then
            echo "::error::a model artifact is committed; it is build output"
            exit 1
          fi
          echo "OK  no .env, raw data or model artifact in the index"

  # The front end on its own: no Python and no data. npm ci installs exactly
  # frontend/package-lock.json, and frontend/.npmrc keeps install scripts off
  # and makes a Node outside package.json's engines an error.
  frontend:
    name: frontend (node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the lock
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # What ships in dist/ is audited at every severity. The dev toolchain
      # blocks at high and above; a moderate dev-only advisory is assessed and
      # listed in SECURITY.md ("Dependency audits"), GHSA-g3hv-75wg-m249 today.
      - name: npm audit (runtime)
        run: npm audit --omit=dev

      - name: npm audit (dev toolchain, high and above)
        run: npm audit --audit-level=high

  # The built app in Chromium against scripts/e2e_server.py: the real API on a
  # synthetic book, model and SHAP cache made in a temporary folder. No
  # dataset is downloaded, and no artifact or test partition is read.
  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the dev lock with make setup
        run: make setup PYTHON=python

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the front end's lock
        working-directory: frontend
        run: npm ci

      # The browser's types are generated from the server's schema; a stale copy
      # would let the two disagree unseen (scripts/export_openapi.py).
      - name: OpenAPI types match the API
        working-directory: frontend
        run: |
          npm run openapi
          git diff --exit-code -- src/api/schema.d.ts

      - name: Build
        working-directory: frontend
        run: npm run build

      # tests/test_wording.py skips without a build; here one is required.
      - name: No causal claim in the built bundle
        env:
          CHURNSENSE_REQUIRE_FRONTEND_BUILD: "1"
        run: .venv/bin/python -m pytest tests/test_wording.py

      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Browser tests (Playwright and axe)
        working-directory: frontend
        run: npx --no-install playwright test

      # Traces and screenshots hold synthetic data only (scripts/e2e_server.py).
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
