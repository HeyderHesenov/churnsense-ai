[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnsense"
version = "0.1.0"
description = "ChurnSense AI - Customer Retention Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# Constraints are declared here; requirements.txt holds the resolved lock
# produced by `pip freeze` after a real install (see Makefile: make lock).
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<2.4",          # upper bound set by numba (see docs/PROJECT_WALKTHROUGH.md)
    "scikit-learn>=1.5,<2",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.22,<8",
    "streamlit>=1.37,<2",
    "shap>=0.46",
    "numba>=0.63",               # 0.63+ is the first line allowing numpy>=2.2
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pip-audit>=2.7",
]
notebook = ["jupyter>=1.0", "ipykernel>=6.29", "nbconvert>=7.16"]

[project.scripts]
churnsense = "churnsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["E501"]   # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]          # pytest fixtures arrive as unused-looking args
# FastAPI dictates these shapes: exception handlers must accept (request, exc)
# whether or not they use both, the lifespan hook takes the app, and
# `Depends`/`File` in a default IS the dependency-injection idiom.
"src/churnsense/api/main.py" = ["ARG001", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: needs the real dataset or a full training run"]
filterwarnings = [
    # shap triggers these from matplotlib at import; not actionable here.
    "ignore::DeprecationWarning:shap.*",
    "ignore::PendingDeprecationWarning:shap.*",
]
