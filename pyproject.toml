[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnsense"
version = "0.1.0"
description = "ChurnSense AI - Customer Retention Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

# Constraints are declared here and repeated in requirements.in and
# requirements-dev.in (tests/test_lock.py keeps them equal). `make lock`
# resolves those into requirements.txt (runtime) and requirements-dev.txt
# (runtime + dev tools), pinned and hashed, and `make setup` installs the dev
# lock with --require-hashes, so documented results reproduce exactly.
# The floor is 3.12 because the lock pins shap 0.52, scipy 1.18 and
# contourpy 1.4, none of which supports 3.11.
dependencies = [
    "pandas>=2.1,<4",
    "numpy>=1.26,<2.6",          # upper bound mirrors numba's own (0.68: numpy<2.6)
    "scikit-learn>=1.5,<2",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "plotly>=5.22,<8",
    "streamlit>=1.59,<2",      # width="stretch" and st.plotly_chart(config=...)
    "shap>=0.46",
    "numba>=0.63",               # 0.63+ is the first line allowing numpy>=2.2
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "uv>=0.12",                  # make lock
    "cyclonedx-bom>=7.4",        # make sbom
]
notebook = ["jupyter>=1.0", "ipykernel>=6.29", "nbconvert>=7.16"]

# No [project.scripts]: the Makefile is the interface, and an entry point
# pointing at a module that does not exist is worse than none.

# The lock is resolved for the platforms the project runs and is tested on:
# macOS on Apple silicon (development) and Linux (CI). Intel macOS is out
# because shap requires numba<0.63 there; Windows because the Makefile is POSIX.
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["E501"]   # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]          # pytest fixtures arrive as unused-looking args
# FastAPI dictates these shapes: exception handlers must accept (request, exc)
# whether or not they use both, the lifespan hook takes the app, and
# `Depends`/`File` in a default IS the dependency-injection idiom.
"src/churnsense/api/main.py" = ["ARG001", "B008"]
# Sections share one signature, render(frame, cfg), so the dispatch table in
# streamlit_app.py can call any of them the same way. The unused parameters are
# marked individually with noqa on those signatures rather than ignored
# file-wide, which would also hide genuinely dead arguments in helpers.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: needs the real dataset or a full training run"]
filterwarnings = [
    # shap triggers these from matplotlib at import; not actionable here.
    "ignore::DeprecationWarning:shap.*",
    "ignore::PendingDeprecationWarning:shap.*",
]
